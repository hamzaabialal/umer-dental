<!--
  Appointment form for the clinic website. Paste into any page (plain HTML, v0, Lovable, Bolt, WordPress HTML block).
  Change API_URL to the clinic app's live address, and add the website's address to BOOKING_ALLOWED_ORIGINS there.
-->
<form id="udc-booking" style="display:grid;gap:12px;max-width:420px;font-family:inherit">
  <input name="name" placeholder="Full name" required minlength="2" maxlength="80" />
  <input name="phone" type="tel" placeholder="Mobile number (03xx xxxxxxx)" required />
  <select name="branch" required>
    <option value="">Choose branch</option>
    <option value="Bahria">Bahria Town, Rawalpindi</option>
    <option value="PWD">PWD, Islamabad</option>
  </select>
  <input name="date" type="date" required />
  <select name="time" required>
    <option value="">Choose time</option>
    <option value="15:00">3:00 PM</option><option value="15:30">3:30 PM</option>
    <option value="16:00">4:00 PM</option><option value="16:30">4:30 PM</option>
    <option value="17:00">5:00 PM</option><option value="17:30">5:30 PM</option>
    <option value="18:00">6:00 PM</option><option value="18:30">6:30 PM</option>
    <option value="19:00">7:00 PM</option><option value="19:30">7:30 PM</option>
    <option value="20:00">8:00 PM</option><option value="20:30">8:30 PM</option>
  </select>
  <select name="treatment">
    <option value="">Treatment (optional)</option>
    <option>Consultation</option><option>Dental Implant</option><option>Root Canal</option>
    <option>Crown / Veneer</option><option>Teeth Whitening</option><option>Scaling &amp; Polishing</option>
    <option>Filling</option><option>Extraction</option><option>Braces / Aligners</option>
    <option>Dentures</option><option>Kids' Dentistry</option><option>Emergency</option>
  </select>
  <textarea name="message" placeholder="Anything we should know? (optional)" maxlength="500"></textarea>
  <!-- Honeypot: hidden from people, bots fill it. Keep it. -->
  <input name="company" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true" />
  <button type="submit">Book Appointment</button>
  <p id="udc-booking-msg" role="status"></p>
</form>

<script>
  (function () {
    var API_URL = "https://clinic.umardental.pk/api/public/bookings";
    var form = document.getElementById("udc-booking");
    var msg = document.getElementById("udc-booking-msg");
    // Earliest selectable day is today (clinic time is close enough to the visitor's for a date picker).
    form.date.min = new Date().toISOString().slice(0, 10);

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      var button = form.querySelector("button");
      button.disabled = true;
      msg.textContent = "Booking…";
      try {
        var res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(Object.fromEntries(new FormData(form))),
        });
        var data = await res.json();
        if (!data.ok) throw new Error(data.error || "Something went wrong.");
        form.reset();
        msg.innerHTML = data.calendarUrl
          ? 'Booked! We will confirm on WhatsApp. <a href="' + data.calendarUrl + '" target="_blank" rel="noopener">Add it to your calendar</a>.'
          : "Booked! We will confirm on WhatsApp.";
      } catch (err) {
        msg.textContent = (err && err.message) || "Could not book. Please WhatsApp us at 0331 0009851.";
      } finally {
        button.disabled = false;
      }
    });
  })();
</script>
